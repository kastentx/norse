<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Yggdrasil - World Tree Icon -->
  <g transform="translate(32, 32)">
    <!-- Tree trunk -->
    <rect x="-4" y="-8" width="8" height="32" fill="#8B4513" stroke="#1a1a2e" stroke-width="1.5"/>
    
    <!-- Roots (three major roots) -->
    <path d="M -4,24 Q -12,28 -16,32" stroke="#8B4513" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 0,24 Q 0,30 0,32" stroke="#8B4513" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 4,24 Q 12,28 16,32" stroke="#8B4513" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Branches/crown -->
    <circle cx="0" cy="-12" r="16" fill="#2d5016" opacity="0.8" stroke="#1a1a2e" stroke-width="1.5"/>
    <circle cx="-8" cy="-16" r="10" fill="#3d6b1f" opacity="0.7"/>
    <circle cx="8" cy="-16" r="10" fill="#3d6b1f" opacity="0.7"/>
    <circle cx="0" cy="-20" r="8" fill="#4a7c28" opacity="0.6"/>
    
    <!-- Highlight leaves -->
    <circle cx="-6" cy="-22" r="2" fill="#D4AF37" opacity="0.6"/>
    <circle cx="6" cy="-22" r="2" fill="#D4AF37" opacity="0.6"/>
    <circle cx="0" cy="-26" r="2" fill="#D4AF37" opacity="0.6"/>
  </g>
</svg>
