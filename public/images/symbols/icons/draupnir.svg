<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Draupnir - Odin's Ring Icon -->
  <g transform="translate(32, 32)">
    <!-- Central ring (Draupnir itself) -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#D4AF37" stroke-width="4"/>
    <circle cx="0" cy="0" r="8" fill="#FFD700" opacity="0.3"/>
    
    <!-- Inner decorative pattern -->
    <circle cx="0" cy="0" r="6" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2"/>
    
    <!-- Eight dripping rings (representing multiplication) -->
    <!-- Top ring -->
    <circle cx="0" cy="-20" r="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
    
    <!-- Top-right ring -->
    <circle cx="14" cy="-14" r="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
    
    <!-- Right ring -->
    <circle cx="20" cy="0" r="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
    
    <!-- Bottom-right ring -->
    <circle cx="14" cy="14" r="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
    
    <!-- Bottom ring -->
    <circle cx="0" cy="20" r="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
    
    <!-- Bottom-left ring -->
    <circle cx="-14" cy="14" r="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
    
    <!-- Left ring -->
    <circle cx="-20" cy="0" r="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
    
    <!-- Top-left ring -->
    <circle cx="-14" cy="-14" r="4" fill="none" stroke="#D4AF37" stroke-width="2" opacity="0.7"/>
    
    <!-- Drip effect from central ring -->
    <path d="M 0,12 L 0,16" stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    <circle cx="0" cy="17" r="1.5" fill="#FFD700" opacity="0.6"/>
  </g>
</svg>
