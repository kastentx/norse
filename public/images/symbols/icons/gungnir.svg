<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gungnir - Odin's Spear Icon -->
  <g transform="translate(32, 32)">
    <!-- Spear shaft -->
    <line x1="0" y1="-28" x2="0" y2="28" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Spear point (diamond shape) -->
    <path d="M 0,-32 L 4,-24 L 0,-20 L -4,-24 Z" fill="#D4AF37" stroke="#1a1a2e" stroke-width="1.5"/>
    
    <!-- Rune inscriptions (simplified) -->
    <line x1="-2" y1="-10" x2="2" y2="-6" stroke="#D4AF37" stroke-width="1" opacity="0.7"/>
    <line x1="-2" y1="0" x2="2" y2="4" stroke="#D4AF37" stroke-width="1" opacity="0.7"/>
    <line x1="-2" y1="10" x2="2" y2="14" stroke="#D4AF37" stroke-width="1" opacity="0.7"/>
    
    <!-- Bottom cap -->
    <circle cx="0" cy="28" r="2" fill="#D4AF37" stroke="#1a1a2e" stroke-width="1"/>
  </g>
</svg>
