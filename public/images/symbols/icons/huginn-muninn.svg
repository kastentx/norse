<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Huginn and Muninn - Odin's Ravens Icon -->
  <g transform="translate(32, 32)">
    <!-- Left raven (Huginn - Thought) -->
    <g transform="translate(-10, 0)">
      <ellipse cx="0" cy="0" rx="6" ry="8" fill="#1a1a2e" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="-2" cy="-2" r="1.5" fill="#D4AF37"/>
      <path d="M 4,0 L 10,-2 L 12,0 L 10,2 Z" fill="#1a1a2e" stroke="#D4AF37" stroke-width="1.5"/>
      <path d="M -4,6 L -8,10 L -6,12 L -2,8 Z" fill="#1a1a2e" stroke="#D4AF37" stroke-width="1"/>
    </g>
    
    <!-- Right raven (Muninn - Memory) -->
    <g transform="translate(10, 0)">
      <ellipse cx="0" cy="0" rx="6" ry="8" fill="#1a1a2e" stroke="#D4AF37" stroke-width="1.5"/>
      <circle cx="2" cy="-2" r="1.5" fill="#D4AF37"/>
      <path d="M -4,0 L -10,-2 L -12,0 L -10,2 Z" fill="#1a1a2e" stroke="#D4AF37" stroke-width="1.5"/>
      <path d="M 4,6 L 8,10 L 6,12 L 2,8 Z" fill="#1a1a2e" stroke="#D4AF37" stroke-width="1"/>
    </g>
    
    <!-- Connection to Odin (subtle arc) -->
    <path d="M -8,-6 Q 0,-10 8,-6" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.5" stroke-dasharray="2,2"/>
  </g>
</svg>
