<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Valknut - Three Interlocked Triangles Icon -->
  <g transform="translate(32, 32)">
    <!-- First triangle (top) -->
    <path d="M 0,-18 L 15,9 L -15,9 Z" 
          fill="none" 
          stroke="#D4AF37" 
          stroke-width="3" 
          stroke-linejoin="round"/>
    
    <!-- Second triangle (bottom left) -->
    <path d="M -13,-4 L 2,23 L -28,23 Z" 
          fill="none" 
          stroke="#D4AF37" 
          stroke-width="3" 
          stroke-linejoin="round"/>
    
    <!-- Third triangle (bottom right) -->
    <path d="M 13,-4 L 28,23 L -2,23 Z" 
          fill="none" 
          stroke="#D4AF37" 
          stroke-width="3" 
          stroke-linejoin="round"/>
    
    <!-- Center intersection point -->
    <circle cx="0" cy="3" r="2.5" fill="#D4AF37"/>
  </g>
</svg>
